<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />


<!-- partial -->
<div class="main-panel">
    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-account-multiple "></i>
                </span></span>مدیریت کاربران
            </h3>
        </div>

        <div class="row">

            <!--Top Side Of Content Start-->
            <div class="col-lg-6 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <form class="forms-sample" method="post">
                            <div class="form-group">
                                <label for="exampleInputUsername1">جست و جو</label>
                                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="جست و جو" name="SearchValue">
                            </div>
                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">جست و جو</button>
                        </form>
                    </div>
                </div>
            </div>
            <!--Top Side Of Content Start-->
            <!--Bottom Side Of Content Start-->
            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">کاربران</h4>
                        </p>
                        <table class="table" th:if="${users.size()>0}">
                            <thead>
                            <tr>
                                <th>ردیف</th>
                                <th>نام و نام خانوادگی</th>
                                <th>نوع کاربر</th>
                                <th>نام کاربری</th>
                                <th>ویرایش</th>
                            </tr>
                            </thead>
                            <tbody>

                            <tr th:each="user : ${users}" th:if="${user.getId() != user_data.getId()}">
                                <th scope="row" th:text="${user.getId()}"/>
                                <th scope="row" th:text="${user.getName()}+${user.getFamily()}"/>
                                <th scope="row" th:text="${user.getUser_type()=='USER'}?کاربر:مدیرکل"/>
                                <th scope="row" th:text="${user.getUsername()}"/>
                                <td><i th:onclick="Open_Link_Dialog(this, window.location.protocol + '//' + window.location.host + '/Admin/Panel/UserManager/User/[[${user.getId()}]]')"><i class="mdi mdi-table-edit" style="font-size: 20px;color:#007bff;cursor: pointer;"></i></i></td>
                            </tr>

                            </tbody>
                        </table>
                        <div style="margin-top:60px;" th:unless="${users.size()>0}">
                            <img th:src="@{/Assets/Admin/images/icons/empty.png}" width="150px" style="display:block;margin:0 auto;" />
                            <p style="width:100%;text-align:center;">هیچ کاربری یافت نشد</p>
                        </div>
                    </div>
                </div>
            </div>
            <!--Bottom Side Of Content Start-->

        </div>

    </div>
    <!-- content-wrapper ends -->



    <ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
