<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />


<!-- partial -->
<div class="main-panel">
    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-buffer"></i>
                </span>
                <span th:text="#{label.allposts}"/>
            </h3>
        </div>

        <div class="row">

            <!--Bottom Side Of Content Start-->
            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title"  th:text="#{label.allposts}"/>
                        </p>
                        <table class="table" th:if="${posts.size>0}">
                            <thead>
                            <tr>
                                <th th:text="#{label.id}"/>
                                <th th:text="#{label.title}"/>
                                <th th:text="#{label.condition}"/>
                                <th th:text="#{label.opration}"/>
                                <th th:text="#{label.delete}"/>
                            </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post :${posts}">
                                    <td th:text="${post.getId()}" />
                                    <td th:text="${post.getTitle()}" />
                                    <td th:text="${post.getEnabled_flag()=='1'}?#{label.up}:#{label.down}" />
                                    <td><i th:onclick="Open_Link_Dialog(this, window.location.protocol + '//' + window.location.host + '/Admin/Panel/Post/Edit/[[${post.getId()}]]')"><i class="mdi mdi-table-edit" style="font-size: 20px;color:#007bff;cursor: pointer;"></i></i></td>
                                    <td><a th:href="@{/Admin/Panel/Post/Delete/{post_id}(post_id=${post.getId()})}"><i class="mdi mdi-delete" style="color: #F00;font-size: 20px;"></i></a></td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:unless="${posts.size>0}">
                            <div style="margin-top:60px;">
                                <img th:src="@{/Assets/Admin/images/icons/empty.png}" style="display:block;margin:0 auto;" width="150px">
                                <p style="width:100%;text-align:center;color:#666;margin-top:20px;" th:text="#{label.posts_is_empty}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--Bottom Side Of Content Start-->

        </div>

    </div>
    <!-- content-wrapper ends -->








    <script>

        function onchange_category(e)
        {
            var sub_section = window.document.getElementById('sub_section');
            var category_combat = window.document.getElementById('category_combat');

            if (category_combat.value == "Root")
            {
                sub_section.style.display = "none";
            }
            else
            {
                sub_section.style.display = "block";
            }
        }

        window.addEventListener('load', function (e) {
            var sub_section = window.document.getElementById('sub_section');
            var category_combat = window.document.getElementById('category_combat');

            if (category_combat.value == "Root") {
                sub_section.style.display = "none";
            }
            else {
                sub_section.style.display = "block";
            }
        });

    </script>

    <style>

        #sub_section
        {
            display: block;
        }

    </style>


<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
