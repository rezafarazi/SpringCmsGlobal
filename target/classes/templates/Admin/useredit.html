<hdr class="insert" th:insert="@{/Admin/Components/empty_header}" />


    <!--Send Notification To User Start-->
    <div class="content-wrapper">
        <div class="row">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title" style="text-align: center;">پروفایل</h4>
                        <p class="card-description" style="text-align: center;">لطفا فیلد های زیر را پر کنید</p>
                        <form class="forms-sample" th:action="@{/Admin/Panel/UserManager/User/Edit/Done}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="user_id" th:value="${edit_user_data.getId()}"/>
                            <div class="form-group">
                                <label for="exampleInputUsername1">نام کاربری</label>
                                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="نام کاربری" name="username" th:value="${edit_user_data.getUsername()}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1">نام</label>
                                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="نام" name="name" th:value="${edit_user_data.getName()}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1">نام خانوادگی</label>
                                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="نام خانوادگی" name="family" th:value="${edit_user_data.getFamily()}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">کلمه عبور جدید</label>
                                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="کلمه عبور جدید" name="password">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">ایمیل</label>
                                <input type="email" class="form-control" id="exampleInputPassword1" placeholder="ایمیل" name="email" th:value="${edit_user_data.getEmail()}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">عکس پروفایل جدید</label>
                                <input type="file" class="form-control" id="exampleInputPassword1" name="profile_image">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">شماره تماس</label>
                                <input type="text" class="form-control" id="exampleInputPassword1" placeholder="شماره تماس" name="phone" th:value="${edit_user_data.getPhone()}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">آدرس</label>
                                <input type="text" class="form-control" id="exampleInputPassword1" placeholder="آدرس" name="address" th:value="${edit_user_data.getAddress()}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1">شهر</label>
                                <select class="form-control" id="exampleInputUsername1" name="city">
                                    <option th:each="city : ${Cites}" th:selected="${city.getId()==edit_user_data.getCity_id().getId()?true:false}" th:text="${city.getName()}" th:value="${city.getId()}"/>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1">بیو</label>
                                <textarea style="height: 150px;" class="form-control" id="exampleInputPassword1" placeholder="بیو" name="bio" th:text="${edit_user_data.getBio()}"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1">نوع کاربری</label>
                                <select class="form-control" id="exampleInputUsername1" name="user_type">
                                    <option th:each="user_type : ${user_types}" th:selected="${user_type.getId()==edit_user_data.getUser_type_id().getId()?true:false}" th:text="${user_type.getTitle()}" th:value="${user_type.getId()}"/>
                                </select>
                            </div>

                            <br>
                            <div th:unless="${google_auth}">
                                <a th:href="@{/Admin/Panel/UserManager/User/DisableGoogleAuth/}+${edit_user_data.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">غیرفعال سازی رمز دوم</a>
                            </div>

                            <br>
                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">تایید</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--Send Notification To User End-->





    <hdr class="insert" th:insert="@{/Admin/Components/empty_footer}" />
