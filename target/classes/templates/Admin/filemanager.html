<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />

<!-- partial -->
<div class="main-panel">
    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-folder "></i>
                </span>
                <span th:text="#{label.filemanager}"/>
            </h3>
        </div>

        <div class="row">

            <!--Top Side Of Content Start-->
            <div class="col-lg-6 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title" th:text="#{label.uploadnewfile}"/>
                        <form th:action="@{/Admin/Panel/FileManager/Upload}" method="POST" class="form-validate" enctype="multipart/form-data">

                            <br />
                            <!--File Select Start-->
                            <input name="Upload_File" type="file" class="upload_file" id="file_upload_btn" onchange='uploadFile(this)' />
                            <label class="upload_file_label" for="file_upload_btn" id="address_bar_file_upload" th:text="#{label.selectfile}"/>

                            <!--Address Start-->
                            <input type="text" name="Address" style="display:none;" id="Upload_Address" th:value="${address}" />
                            <!--Address End-->
                            <!--File Select Start-->
                            <br />
                            <br />
                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2" th:text="#{label.done}"/>

                        </form>
                    </div>
                </div>
            </div>
            <!--Top Side Of Content Start-->
            <!--Top Side Of Content Start-->
            <div class="col-lg-6 grid-margin stretch-card">
                <div class="card">

                    <div class="card-body">
                        <h4 class="card-title" th:text="#{label.newfolder}"/>
                        </p>
                        <form th:action="@{/Admin/Panel/FileManager/CreateFolder}" method="POST" class="form-validate">

                            <div class="form-group">
                                <label for="exampleInputPassword1"  th:text="#{label.newfoldername}"/>
                                <input type="text" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.newfoldername}" name="Folder_Name">
                            </div>

                            <!--Address Start-->
                            <input type="hidden" name="Addrs" style="display:none;" id="New_Folder_Address" th:value="${address}" />
                            <!--Address End-->

                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2" th:text="#{label.done}"/>

                        </form>
                    </div>

                </div>
            </div>
            <!--Top Side Of Content Start-->
            <!--Bottom Side Of Content Start-->
            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title" th:text="#{label.currentpathfiles}"/>
                        </p>
                        <table th:if="${fileslen>0}" class="table">
                            <thead>
                            <tr>
                                <th th:text="#{label.name}"/>
                                <th th:text="#{label.type}"/>
                                <th th:text="#{label.opration}"/>
                            </tr>
                            </thead>
                            <tbody>

                            <tr th:each="file : ${files}" th:if="${!file.isDirectory()}">
                                <th scope="row">
                                    <a th:href="@{${(address==null)}? ${curentlocation}+'/'+${file.getName()}:${curentlocation}+'/'+${address}+'/'+${file.getName()}}">
                                        <p th:text="${file.getName()}" />
                                    </a>
                                </th>
                                <td><i style="font-size:18px;" class="mdi mdi-file menu-icon"></i></td>
                                <td><a th:href="@{'/Admin/Panel/FileManager/Delete?name='+${file.getName()}+'&path='+${address}}"><i style="color:red;font-size:18px;" class="mdi mdi-delete menu-icon"></i></a></td>
                            </tr>
                            <tr th:each="file : ${files}" th:unless="${!file.isDirectory()}">
                                <th scope="row">
                                    <a th:href="@{${(address==null)}?'?path='+${file.getName()}:'?path='+${address}+'/'+${file.getName()}}">
                                        <p th:text="${file.getName()}" />
                                    </a>
                                </th>
                                <td><i style="font-size:18px;" class="mdi mdi-folder menu-icon"></i></td>
                                <td><a th:href="@{'/Admin/Panel/FileManager/DeleteDir?path='+${address}+'/'+${file.getName()}}"><i style="color:red;font-size:18px;" class="mdi mdi-delete menu-icon"></i></a></td>
                            </tr>

                            </tbody>
                        </table>
                        <div style="margin-top:60px;" th:unless="${fileslen>0}">
                            <img th:src="@{/Assets/Admin/images/icons/empty.png}" width="150px" style="display:block;margin:0 auto;" />
                            <p style="width:100%;text-align:center;" th:text="#{label.folder_is_empty}"/>
                        </div>
                    </div>
                </div>
            </div>
            <!--Bottom Side Of Content Start-->

        </div>

    </div>
    <!-- content-wrapper ends -->


<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
