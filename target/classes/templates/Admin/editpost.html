<hdr class="insert" th:insert="@{/Admin/Components/empty_header}" />

<!-- partial -->
    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-cube-send"></i>
                </span>ویرایش پست
            </h3>
        </div>

        <div class="row">

            <!--Right Side Of Content Start-->
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <form class="forms-sample" method="post" th:action="@{/Admin/Panel/Post/Edit/Done}">
                            <input type="hidden" name="post_id" th:value="${post.getId()}">
                            <div class="form-group">
                                <label for="exampleInputUsername1" style="width: 100%;text-align: right;">عنوان</label>
                                <input th:value="${post.getTitle()}" type="text" class="form-control" id="exampleInputUsername1" placeholder="عنوان" name="title">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1" style="width: 100%;text-align: right;">دسته بندی</label>
                                <select id="category_combat" class="form-control" name="category" onchange="onchange_category(this)">
                                    <option th:each="category : ${categories}" th:value="${category.getId()}" th:text="${category.getTitle()}" th:selected="${post.getCategory_id()==category.getId()}"/>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1" style="width: 100%;text-align: right;">آدرس لینک عکس عنوان</label>
                                <input th:value="${post.getImage_address()}" type="text" class="form-control" id="exampleInputUsername1" placeholder="آدرس عکس تصویر پست" name="post_image_address">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1" style="width: 100%;text-align: right;">قابل مشاهده بودن</label>
                                <select class="form-control" name="Visibleity">
                                    <option value="1" th:selected="${post.getEnabled_flag()=='1'}">قابل مشاهده بودن</option>
                                    <option value="0" th:selected="${post.getEnabled_flag()=='0'}">غیر قابل مشاهده بودن</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1" style="width: 100%;text-align: right;">محتوا</label>

                                <div style="margin-bottom: 20px;margin-top: 10px;display: flex;">
                                    <btn onclick="ParagraphOnClick(this)" class="Element_btn">پاراگراف</btn>
                                    <btn onclick="HeaderOnClick(this)" class="Element_btn">هدر</btn>
                                    <btn onclick="ImageOnClick(this)" class="Element_btn">عکس</btn>
                                    <btn onclick="VideoOnClick(this)" class="Element_btn">ویدیو</btn>
                                    <btn onclick="LinkOnClick(this)" class="Element_btn">لینک</btn>
                                </div>

                                <textarea style="direction:ltr;resize:vertical;height:250px;" class="form-control" id="content_text_area" name="Content" th:text="${post.getContent()}"/>
                            </div>
                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">تایید</button>
                        </form>
                    </div>
                </div>
            </div>
            <!--Right Side Of Content End-->
        </div>

    </div>
    <!-- content-wrapper ends -->




<!--Content Managmant Start-->

<!--Paragraph Start-->
<div id="parapraph_dialog">
    <i class="mdi mdi-close Close_Btn" onclick="Close_All_Dialogs(this)"></i>
    <div id="parapraph_dialog_content">
        <div>
            <h5 style="text-align: right;">پاراگراف</h5>
            <textarea id="new_paragraph_text_area" required name="cntent" style="margin-top:10px;resize: vertical;height: 250px;text-align: right;" class="form-control" placeholder="پاراگراف"></textarea>
            <br>
            <btn onclick="ParagraphDoneClick(this)" style="width: 100%;" class="btn btn-gradient-primary mr-2">تایید</btn>
        </div>
    </div>
</div>
<!--Paragraph End-->


<!--Header Start-->
<div id="header_dialog">
    <i class="mdi mdi-close Close_Btn" onclick="Close_All_Dialogs(this)"></i>
    <div id="header_dialog_content">
        <div>
            <h5 style="text-align: right;">هدر</h5>
            <input placeholder="هدر" id="new_header_input" required name="cntent" style="margin-top:10px;text-align: right;" class="form-control"/>
            <br>
            <btn onclick="HeaderDoneClick(this)" style="width: 100%;" class="btn btn-gradient-primary mr-2">تایید</btn>
        </div>
    </div>
</div>
<!--Header End-->

<!--Image Start-->
<div id="image_dialog">
    <i class="mdi mdi-close Close_Btn" onclick="Close_All_Dialogs(this)"></i>
    <div id="image_dialog_content">
        <div>
            <h5 style="text-align: right;">عکس</h5>
            <input placeholder="آدرس عکس" id="new_image_input" required name="cntent" style="margin-top:10px;text-align: left;direction: ltr;" class="form-control"/>
            <br>
            <input placeholder="توضیحات عکس" id="new_image_alt_input" required name="cntent" style="margin-top:10px;text-align: left;direction: ltr;" class="form-control"/>
            <br>
            <btn onclick="ImageDoneClick(this)" style="width: 100%;" class="btn btn-gradient-primary mr-2">تایید</btn>
        </div>
    </div>
</div>
<!--Image End-->

<!--Video Start-->
<div id="video_dialog">
    <i class="mdi mdi-close Close_Btn" onclick="Close_All_Dialogs(this)"></i>
    <div id="video_dialog_content">
        <div>
            <h5 style="text-align: right;">ویدیو</h5>
            <input placeholder="آدرس ویدیو" id="new_video_input" required name="cntent" style="margin-top:10px;text-align: left;direction: ltr;" class="form-control"/>
            <br>
            <btn onclick="VideoDoneClick(this)" style="width: 100%;" class="btn btn-gradient-primary mr-2">تایید</btn>
        </div>
    </div>
</div>
<!--Video End-->

<!--link Start-->
<div id="link_dialog">
    <i class="mdi mdi-close Close_Btn" onclick="Close_All_Dialogs(this)"></i>
    <div id="link_dialog_content">
        <div>
            <h5 style="text-align: right;">لینک</h5>
            <input placeholder="متن لینک" id="new_link_input" required name="cntent" style="margin-top:10px;text-align: right;direction: rtl;" class="form-control"/>
            <br>
            <input placeholder="آدرس لینک" id="new_link_href_input" required name="cntent" style="margin-top:10px;text-align: left;direction: ltr;" class="form-control"/>
            <br>
            <btn onclick="LinkDoneClick(this)" style="width: 100%;" class="btn btn-gradient-primary mr-2">تایید</btn>
        </div>
    </div>
</div>
<!--link End-->


<style>

    .Close_Btn
    {
        color: var(--white);
        position: absolute;
        top: 10px;
        left: 10px;
        cursor: pointer;
    }

    .Element_btn
    {
        margin-right: 5px;
        margin-left: 5px;
        padding: 5px 10px;
        color:var(--white);
        background: var(--primary);
        border-radius: 25px;
        cursor: pointer;
    }

    #parapraph_dialog
    {
        width: 100vw;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: #00000066;
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #parapraph_dialog_content
    {
        width: 75%;
        min-height: 350px;
        background: var(--white);
        border-radius: 10px;
        padding: 20px;
    }

    #header_dialog
    {
        width: 100vw;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: #00000066;
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #header_dialog_content
    {
        width: 75%;
        background: var(--white);
        border-radius: 10px;
        padding: 20px;
    }

    #video_dialog
    {
        width: 100vw;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: #00000066;
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #video_dialog_content
    {
        width: 75%;
        background: var(--white);
        border-radius: 10px;
        padding: 20px;
    }

    #image_dialog
    {
        width: 100vw;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: #00000066;
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #image_dialog_content
    {
        width: 75%;
        background: var(--white);
        border-radius: 10px;
        padding: 20px;
    }

    #link_dialog
    {
        width: 100vw;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background: #00000066;
        z-index: 99999;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #link_dialog_content
    {
        width: 75%;
        background: var(--white);
        border-radius: 10px;
        padding: 20px;
    }

</style>

<script>

    //Close All Dialogs Start
    function Close_All_Dialogs(e)
    {
        var parapraph_dialog=window.document.getElementById('parapraph_dialog');
        parapraph_dialog.style.display="none";

        var header_dialog=window.document.getElementById('header_dialog');
        header_dialog.style.display="none";

        var image_dialog=window.document.getElementById('image_dialog');
        image_dialog.style.display="none";

        var video_dialog=window.document.getElementById('video_dialog');
        video_dialog.style.display="none";

        var link_dialog=window.document.getElementById('link_dialog');
        link_dialog.style.display="none";
    }
    //Close All Dialogs End

    //Paragraph Start
    function ParagraphOnClick(e)
    {
        var parapraph_dialog=window.document.getElementById('parapraph_dialog');
        parapraph_dialog.style.display="flex";
    }

    function ParagraphDoneClick(e)
    {
        var content_text_area=window.document.getElementById('content_text_area');
        var new_paragraph_text_area=window.document.getElementById('new_paragraph_text_area');
        var parapraph_dialog=window.document.getElementById('parapraph_dialog');

        content_text_area.innerText+="<p>"+new_paragraph_text_area.value+"</p>";
        new_paragraph_text_area.value="";
        parapraph_dialog.style.display="none";
    }
    //Paragraph End


    //Header Start
    function HeaderOnClick(e)
    {
        var header_dialog=window.document.getElementById('header_dialog');
        header_dialog.style.display="flex";
    }

    function HeaderDoneClick(e)
    {
        var content_text_area=window.document.getElementById('content_text_area');
        var new_header_input=window.document.getElementById('new_header_input');
        var header_dialog=window.document.getElementById('header_dialog');

        content_text_area.innerText=content_text_area.value+("<h3>"+new_header_input.value+"</h3>");
        new_header_input.value="";
        header_dialog.style.display="none";
    }
    //Header End

    //Image Start
    function ImageOnClick(e)
    {
        var image_dialog=window.document.getElementById('image_dialog');
        image_dialog.style.display="flex";
    }

    function ImageDoneClick(e)
    {
        var content_text_area=window.document.getElementById('content_text_area');
        var new_image_input=window.document.getElementById('new_image_input');
        var new_image_alt_input=window.document.getElementById('new_image_alt_input');
        var image_dialog=window.document.getElementById('image_dialog');

        content_text_area.innerText=content_text_area.value+("<img src='"+new_image_input.value+"' alt='"+new_image_alt_input.value+"'/>");
        new_image_input.value="";
        new_image_alt_input.value="";
        image_dialog.style.display="none";
    }
    //Image End

    //Video Start
    function VideoOnClick(e)
    {
        var video_dialog=window.document.getElementById('video_dialog');
        video_dialog.style.display="flex";
    }

    function VideoDoneClick(e)
    {
        var content_text_area=window.document.getElementById('content_text_area');
        var new_video_input=window.document.getElementById('new_video_input');
        var video_dialog=window.document.getElementById('video_dialog');

        content_text_area.innerText=content_text_area.value+("<video controls><source src=\""+new_video_input.value+"\" type=\"video/mp4\"></video>");
        new_video_input.value="";
        video_dialog.style.display="none";
    }
    //Video End

    //Image Start
    function LinkOnClick(e)
    {
        var link_dialog=window.document.getElementById('link_dialog');
        link_dialog.style.display="flex";
    }

    function LinkDoneClick(e)
    {
        var content_text_area=window.document.getElementById('content_text_area');
        var new_link_input=window.document.getElementById('new_link_input');
        var new_link_href_input=window.document.getElementById('new_link_href_input');
        var link_dialog=window.document.getElementById('link_dialog');

        content_text_area.innerText+=content_text_area.value+("<a href='"+new_link_href_input.value+"'>"+new_link_input.value+"</a>");
        new_link_input.value="";
        new_link_href_input.value="";
        link_dialog.style.display="none";
    }
    //Image End

</script>
<!--Content Managmant End-->
