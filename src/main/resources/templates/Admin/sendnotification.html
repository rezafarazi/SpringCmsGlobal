<hdr class="insert" th:insert="@{/Admin/Components/empty_header}" />



<!--Send Notification To User Start-->
<div class="content-wrapper" style="height: 100vh;">
    <div class="row">
        <div class="col-md-11 grid-margin stretch-card" style="margin: 50px auto;">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title" style="text-align: center;">ارسال نوتیفیکیشن</h4>
                    <p class="card-description" style="text-align: center;">فیلد های زیر را پر کنید</p>
                    <form class="forms-sample" method="post" action="/Admin/Panel/UserManager/User/SendNotifications/Done">
                        <input type="hidden" th:value="${user_id}" name="user_id"/>
                        <div class="form-group">
                            <label for="exampleInputUsername1">عنوان</label>
                            <input type="text" class="form-control" id="exampleInputUsername1" placeholder="عنوان" name="title">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1">متن</label>
                            <textarea style="height: 60px;" class="form-control" id="exampleInputPassword1" placeholder="متن" name="content_text"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1">لینک</label>
                            <input type="text" class="form-control" id="exampleInputPassword1" placeholder="لینک" name="link">
                        </div>
                        <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">ارسال</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!--Send Notification To User End-->


<ftr class="insert" th:insert="@{/Admin/Components/empty_footer}" />
