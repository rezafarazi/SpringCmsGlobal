<hdr class="insert" th:insert="@{/Admin/Components/empty_header}" />


<div class="content-wrapper">

    <div class="row">

        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">

                    <div class="form-group">
                        <label for="exampleInputUsername1">عنوان</label>
                        <label for="exampleInputUsername1" th:text="${order.getStore_id().getTitle()}"/>
                    </div>

                    <div class="form-group">
                        <label for="exampleInputUsername1">نام و نام خانوادگی</label>
                        <label for="exampleInputUsername1" th:text="${order.getUser_id().getName()}+' '+${order.getUser_id().getFamily()}"/>
                    </div>

                    <div class="form-group">
                        <label for="exampleInputUsername1">شماره تماس</label>
                        <label for="exampleInputUsername1" th:text="${order.getUser_id().getPhone()}"/>
                    </div>

                    <div class="form-group">
                        <label for="exampleInputUsername1">آدرس</label>
                        <label for="exampleInputUsername1" th:text="${order.getUser_id().getAddress()}"/>
                    </div>

                    <div th:switch="${order.getOrder_status}">
                        <div th:case="'0'">
                            <a th:href="@{/Admin/Panel/Store/Order/SetPay/}+${order.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">پرداخت</a>
                            <br>
                            <br>
                            <a th:href="@{/Admin/Panel/Store/Order/SetPay/}+${order.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">حذف</a>
                            <br>
                            <br>
                            <a th:href="@{/Admin/Panel/Store/Order/SetOk/}+${order.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">دریافت شد</a>
                        </div>
                        <div th:case="'1'">
                            <a th:href="@{/Admin/Panel/Store/Order/SetRemove/}+${order.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">حذف</a>
                            <br>
                            <br>
                            <a th:href="@{/Admin/Panel/Store/Order/SetOk/}+${order.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">دریافت شد</a>
                        </div>
                        <div th:case="'2'">
                            <a th:href="@{/Admin/Panel/Store/Order/SetRemove/}+${order.getId()}" style="width: 100%;" class="btn btn-gradient-primary mr-2">حذف</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>
<!-- content-wrapper ends -->


<hdr class="insert" th:insert="@{/Admin/Components/empty_footer}" />
