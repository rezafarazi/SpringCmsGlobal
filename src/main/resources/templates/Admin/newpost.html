<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />

<!-- partial -->
<div class="main-panel">
    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-cube-send"></i>
                </span>پست جدید
            </h3>
        </div>

        <div class="row">

            <!--Right Side Of Content Start-->
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <form class="forms-sample" method="post" action="/Admin/Panel/NewPost/Done">
                            <div class="form-group">
                                <label for="exampleInputUsername1" style="width: 100%;text-align: right;">عنوان</label>
                                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="عنوان" name="title">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1" style="width: 100%;text-align: right;">دسته بندی</label>
                                <select id="category_combat" class="form-control" name="category" onchange="onchange_category(this)">
                                    <option th:each="category : ${categories}" th:value="${category.getId()}" th:text="${category.getTitle()}"/>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1" style="width: 100%;text-align: right;">آدرس لینک عکس عنوان</label>
                                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="آدرس عکس تصویر پست" name="post_image_address">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1" style="width: 100%;text-align: right;">قابل مشاهده بودن</label>
                                <select class="form-control" name="Visibleity">
                                    <option value="1">قابل مشاهده بودن</option>
                                    <option value="0">غیر قابل مشاهده بودن</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1" style="width: 100%;text-align: right;">محتوا</label>
                                <textarea style="direction:ltr;resize:vertical;height:250px;" class="form-control" id="exampleInputUsername1" name="Content"></textarea>
                            </div>
                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">تایید</button>
                        </form>
                    </div>
                </div>
            </div>
            <!--Right Side Of Content End-->
        </div>

    </div>
    <!-- content-wrapper ends -->







<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
