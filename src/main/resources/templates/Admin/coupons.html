<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />


<!-- partial -->
<div class="main-panel">
  <!--Send Notification To User Start-->
  <div class="content-wrapper">
    <div class="page-header">
      <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                  <i class="mdi mdi-paperclip "></i>
                </span>کوپن
      </h3>
    </div>
    <div class="row">

      <div class="col-lg-6 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title" ></h4>
            </p>

            <form method="post" action="/Admin/Panel/Store/Coupon/New">

              <div class="form-group">
                <label for="exampleInputUsername1">تعداد</label>
                <input type="number" class="form-control" id="exampleInputUsername1" placeholder="تعداد" name="count" required>
              </div>

              <button type="submit" style="width: 100%;" class="btn btn-gradient-primary mr-2">ساخت</btn>

            </form>

          </div>
        </div>
      </div>


      <div class="col-lg-6 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title" ></h4>
            </p>

            <table th:if="${coupons.size>0}" class="table">

              <thead>
              <th>کد</th>
              <th>تعداد باقی مانده</th>
              <th>رویداد</th>
              </thead>
              <tbody>
              <tr th:each="coupon : ${coupons}">
                <td th:text="${coupon.getCode()}"/>
                <td th:text="${coupon.getCount()}"/>
                <td><a th:href="@{/Admin/Panel/Store/Coupon/Remove/}+${coupon.getId()}"><i class="mdi mdi-delete" style="color: #F00;font-size: 20px;"></i></a></td>
              </tr>

              </tbody>

            </table>
            <div th:unless="${coupons.size>0}">
              <div style="margin-top:60px;">
                <img th:src="@{/Assets/Admin/images/icons/empty.png}" style="display:block;margin:0 auto;" width="150px">
                <p style="width:100%;text-align:center;color:#666;margin-top:20px;">هیچ موردی یافت نشد</p>
              </div>
            </div>


          </div>
        </div>
      </div>


    </div>
  </div>
  <!--Send Notification To User End-->

<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
