<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />



<div class="main-panel">
    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-card"></i>
                </span></span>پرداخت ها
            </h3>
        </div>

        <div class="row">

            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <table th:if="${transactions.size()>0}" class="table">
                            <thead>
                            <tr>
                                <th>ردیف</th>
                                <th>نام و نام خانوادگی</th>
                                <th>تاریخ</th>
                                <th>مقدار</th>
                            </tr>
                            </thead>
                            <tbody>

                            <tr th:each="tarnsaction : ${transactions}">
                                <td th:text="${tarnsaction.getId()}"/>
                                <td th:text="${tarnsaction.getUser_id().getName()} +' '+ ${tarnsaction.getUser_id().getFamily()}"/>
                                <td th:text="${tarnsaction.getDate()}"/>
                                <td th:text="${tarnsaction.getValue()}"/>
                            </tr>

                            </tbody>
                        </table>
                        <div th:unless="${transactions.size()>0}" style="width: 100%;height: 250px;display: flex;justify-content: center;align-items: center;">
                            <div style="width: 150px;">
                                <img style="margin: 0 auto;" th:src="@{/Assets/Admin/images/icons/empty.png}" width="150px"/>
                                <p style="margin: 10px auto;text-align: center;">پرداختی موجود نیست</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </div>


<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
