<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />


<!-- partial -->
<div class="main-panel">
  <div class="content-wrapper">
    <div class="page-header">
      <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                  <i class="mdi mdi-paperclip"></i>
                </span>همه پست های فروشگاهی
      </h3>
    </div>

    <div class="row">


      <!--Top Side Of Content Start-->
      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <form class="forms-sample" method="post" action="{{url('/Admin/Store/AllStores/Search')}}">
              <div class="form-group">
                <label style="width: 100%;text-align: right;" for="exampleInputUsername1">جست و جو</label>
                <input type="text" class="form-control" id="exampleInputUsername1" placeholder="جست و جو" name="search">
              </div>
              <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">جست و جو</button>
            </form>
          </div>
        </div>
      </div>
      <!--Top Side Of Content Start-->


      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <table th:if="${all_stores.size>0}" class="table">
              <thead>
              <tr>
                <th>ردیف</th>
                <th>عنوان</th>
                <th>تاریخ انتشار</th>
                <th>ویرایش</th>
                <th>حذف</th>
              </tr>
              </thead>
              <tbody>

              <tr th:each="store :${all_stores}">
                <td th:text="${store.getId()}"/>
                <td th:text="${store.getTitle()}"/>
                <td th:text="${store.getDate()}"/>
                <td><i th:onclick="| Open_Link_Dialog(this,'/Admin/Panel/Store/AllStores/${store.getId()}') |" class="mdi mdi-table-edit" style="color: #F00;font-size: 20px;cursor: pointer;"></i></td>
                <td><a th:href="@{/Admin/Panel/Store/AllStores/Remove/}+${store.getId()}"><i class="mdi mdi-delete" style="color: #F00;font-size: 20px;"></i></a></td>
              </tr>

              </tbody>
            </table>
            <div th:unless="${all_stores.size>0}" >
              <div style="margin-top:60px;">
                <img th:src="@{/Assets/Admin/images/icons/empty.png}" style="display:block;margin:0 auto;" width="150px">
                <p style="width:100%;text-align:center;color:#666;margin-top:20px;">هیچ موردی یافت نشد</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
  <!-- content-wrapper ends -->




<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
