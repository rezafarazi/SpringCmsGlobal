<hdr class="insert" th:insert="@{/Admin/Components/empty_header}" />


    <!--Send Notification To User Start-->
    <div class="content-wrapper">
        <div class="row">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title" style="text-align: center;" th:text="#{label.profile}"/>
                        <p class="card-description" style="text-align: center;" th:text="#{label.please_fill_under_data}"/>
                        <form class="forms-sample" th:action="@{/Admin/Panel/UserManager/User/Edit/Done}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="user_id" th:value="${edit_user_data.id}"/>
                            <div class="form-group">
                                <label for="exampleInputUsername1"  th:text="#{label.username}"/>
                                <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.username}" name="username" th:value="${edit_user_data.username}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1"  th:text="#{label.name}"/>
                                <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.name}" name="name" th:value="${edit_user_data.name}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputUsername1"  th:text="#{label.family}"/>
                                <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.family}" name="family" th:value="${edit_user_data.family}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1"  th:text="#{label.newpassword}"/>
                                <input type="password" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.newpassword}" name="password">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1"  th:text="#{label.email}"/>
                                <input type="email" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.email}" name="email" th:value="${edit_user_data.email}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1"  th:text="#{label.phone}"/>
                                <input type="text" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.phone}" name="phone" th:value="${edit_user_data.phone}">
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1"  th:text="#{label.usertype}"/>
                                <select class="form-control" name="usertype">
                                    <option value="USER" th:selected="${edit_user_data.getUser_type=='USER'}" th:text="#{label.user}" />
                                    <option value="ADMIN" th:selected="${edit_user_data.getUser_type=='ADMIN'}" th:text="#{label.admin}"/>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="exampleInputPassword1"  th:text="#{label.usercondition}"/>
                                <select class="form-control" name="active_user">
                                    <option th:selected="${edit_user_data.getActive_user_flag=='1'}" value="1" th:text="#{label.active}"/>
                                    <option th:selected="${edit_user_data.getActive_user_flag=='0'}" value="0" th:text="#{label.diactive}"/>
                                </select>
                            </div>
                            <br>
                            <br>
                            <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2" th:text="#{label.done}"/>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--Send Notification To User End-->





    <hdr class="insert" th:insert="@{/Admin/Components/empty_footer}" />
