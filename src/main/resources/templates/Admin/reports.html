<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />



<!-- partial -->
<div class="main-panel">
  <div class="content-wrapper">
    <div class="page-header">
      <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                  <i class="mdi mdi-account-multiple "></i>
                </span>گزارش ها
      </h3>
    </div>

    <div class="row">


      <!--Bottom Side Of Content Start-->
      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title">همه گزارش ها</h4>
            </p>

            <table th:if="${(reports.size>0)}" class="table">
              <thead>
              <tr>
                <th>عنوان پست</th>
                <th>متن گزارش</th>
                <th>تاریخ</th>
                <th>نوع گزارش</th>
                <th>بررسی شد</th>
              </tr>
              </thead>
              <tbody>

              <tr th:each="report : ${reports}">
                <td th:text="${report.getPost_id().getTitle()}"/>
                <td th:text="${report.getContent()}"/>
                <td th:text="${report.getDate_time()}"/>
                <td th:text="${report.getReport_id().getTitle()}"/>
                <td><a th:href="@{/Admin/Panel/Reports/ReportSeen/}+${report.getId()}"><i style="color:#00adee;" class="mdi mdi-check-all"></i></a></td>
              </tr>

              </tbody>
            </table>

            <div th:unless="${(reports.size>0)}">
              <div style="margin-top:60px;">
                <img th:src="@{/Assets/Admin/images/icons/empty.png}" style="display:block;margin:0 auto;" width="150px">
                <p style="width:100%;text-align:center;color:#666;margin-top:20px;">هیچ موردی یافت نشد</p>
              </div>
            </div>

          </div>
        </div>
      </div>
      <!--Bottom Side Of Content Start-->

    </div>

  </div>
  <!-- content-wrapper ends -->




<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
