<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />



<!-- partial -->
<div class="main-panel">
  <div class="content-wrapper">
    <div class="page-header">
      <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                  <i class="mdi mdi-paperclip"></i>
                </span>تخفیف برای همه
      </h3>
    </div>

    <div class="row">


      <!--Left Side Of Content Start-->
      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">

            <div th:if="${discount=='' || discount=='0'}">
              <!--Get new discount start-->
              <form class="forms-sample" method="post" action="/Admin/Panel/Store/Discount/New">
                <div class="form-group">
                  <label for="exampleInputUsername1">تخفیف جدید</label>
                  <input type="text" class="form-control" id="exampleInputUsername1" placeholder="اگر زیر 100 باشد درصد اگر بالای 100 از قیمت کم می شود" name="discount" required>
                </div>
                <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">تایید</button>
              </form>
              <!--Get new discount end-->
              <div style="width: 100%;height: 250px;display: flex;justify-content: center;align-items: center;">
                <div style="width: 150px;">
                  <img style="margin: 0 auto;" th:src="@{/Assets/Admin/images/icons/free.png}" width="150px"/>
                  <p style="margin: 10px auto;text-align: center;">هیچ تخفیفی موجود نیست</p>
                </div>
              </div>
            </div>

            <div th:unless="${discount=='' || discount=='0'}" style="width: 100%;height: 250px;display: flex;justify-content: center;align-items: center;">
              <div style="width: 150px;">
                <img style="margin: 0 auto;" th:src="@{/Assets/Admin/images/icons/free.png}" width="150px"/>
                <p style="margin: 10px auto;text-align: center;" th:text="${discount}+تخفیف"/>
                <a href="/Admin/Panel/Store/Discount/Remove" style="cursor: pointer;color:var(--primary);text-align: center;display: block;margin: 0 auto;">حذف تخفیف</a>
              </div>
            </div>


          </div>
        </div>
      </div>
      <!--Left Side Of Content End-->


    </div>

  </div>
  <!-- content-wrapper ends -->



<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
