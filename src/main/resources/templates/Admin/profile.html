<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />


<!-- partial -->
    <div class="main-panel">
        <!--Send Notification To User Start-->
        <div class="content-wrapper">
            <div class="page-header">
                <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                    <i class="mdi mdi-account "></i>
                </span>پرفایل
            </div>
            <div class="row">
                <div class="col-md-12 grid-margin stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title" style="text-align: center;">پروفایل</h4>
                            <p class="card-description" style="text-align: center;">لطفا فیلد های زیر را پر کنید</p>
                            <form class="forms-sample" method="post" enctype="multipart/form-data">
                                <input type="hidden" th:value="${user_data.getId()}" name="user_id" />
                                <div class="form-group">
                                    <label for="exampleInputUsername1">نام کاربری</label>
                                    <input type="text" class="form-control" id="exampleInputUsername1" placeholder="نام کاربری" name="username" th:value="${user_data.getUsername()}">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputUsername1">نام</label>
                                    <input type="text" class="form-control" id="exampleInputUsername1" placeholder="نام" name="name" th:value="${user_data.getName()}">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputUsername1">نام خانوادگی</label>
                                    <input type="text" class="form-control" id="exampleInputUsername1" placeholder="نام خانوادگی" name="family" th:value="${user_data.getFamily()}">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputPassword1">کلمه عبور جدید</label>
                                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="کلمه عبور جدید" name="password">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputPassword1">ایمیل</label>
                                    <input type="email" class="form-control" id="exampleInputPassword1" placeholder="ایمیل" name="email" th:value="${user_data.getEmail()}">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputPassword1">عکس پروفایل جدید</label>
                                    <input type="file" class="form-control" id="exampleInputPassword1" name="profile_image">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputPassword1">شماره تماس</label>
                                    <input type="text" class="form-control" id="exampleInputPassword1" placeholder="شماره تماس" name="phone" th:value="${user_data.getPhone()}">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputPassword1">آدرس</label>
                                    <input type="text" class="form-control" id="exampleInputPassword1" placeholder="آدرس" name="address" th:value="${user_data.getAddress()}">
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputUsername1">شهر</label>
                                    <select class="form-control" id="exampleInputUsername1" name="city">

                                        <option th:each="city : ${Cites}" th:selected="${city.getId()==user_data.getCity_id().getId()?true:false}" th:text="${city.getName()}" th:value="${city.getId()}"/>

                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="exampleInputPassword1">بیو</label>
                                    <textarea style="height: 150px;" class="form-control" id="exampleInputPassword1" placeholder="بیو" name="bio" th:text="${user_data.getBio()}"></textarea>
                                </div>

                                <br>
                                <div th:if="${google_auth}">
                                    <a th:href="@{/Admin/Panel/Profile/Active2F}" style="width: 100%;" class="btn btn-gradient-primary mr-2">فعال سازی رمز دوم</a>
                                </div>
                                <div th:unless="${google_auth}">
                                    <a th:href="@{/Admin/Panel/Profile/Diactive2F}" style="width: 100%;" class="btn btn-gradient-primary mr-2">غیرفعال سازی رمز دوم</a>
                                </div>
                                <br>
                                <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2">تایید</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--Send Notification To User End-->





<hdr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
