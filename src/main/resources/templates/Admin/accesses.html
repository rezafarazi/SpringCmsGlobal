<hdr class="insert" th:insert="@{/Admin/Components/panel_header}" />


<!-- partial -->
<div class="main-panel">
  <div class="content-wrapper">

    <div class="page-header">
      <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                  <i class="mdi mdi-fingerprint"></i>
                </span></span><span th:text="#{label.access}"/>
      </h3>
    </div>

    <div class="row">

      <!--Right Side Of Content Start-->
      <div class="col-md-6 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <form class="forms-sample" action="/Admin/Panel/Groups/New" method="post">
              <div class="form-group">
                <label for="exampleInputUsername1" th:text="#{label.name}"/>
                <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.name}" name="title" style="text-align: center;" required>
              </div>
              <div class="form-group">
                <label for="exampleInputPassword1" th:text="#{label.en_name}"/>
                <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.en_name}" name="en_title" style="text-align: center;" required>
              </div>
              <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2" th:text="#{label.new}"/>
            </form>
          </div>
        </div>
      </div>
      <!--Right Side Of Content End-->


      <!--Bottom Side Of Content Start-->
      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title" th:text="#{label.allaccess}"/>


            <table th:if="${ussertypes.size>0}" class="table">
              <thead>
              <tr>
                <th th:text="#{label.name}"/>
                <th th:text="#{label.en_name}"/>
                <th th:text="#{label.delete}"/>
              </tr>
              </thead>
              <tbody>

              <tr th:each="ussertype : ${ussertypes}">
                <td th:text="${ussertype.getTitle()}"/>
                <td th:text="${ussertype.getEn_title()}"/>
                <td><a th:href="@{/Admin/Panel/Groups/Delete/}+${ussertype.getId()}"><i class="mdi mdi-delete" style="color: #F00;font-size: 20px;"></i></a></td>
              </tr>

              </tbody>
            </table>

            <div th:unless="${ussertypes.size>0}">
              <div style="margin-top:60px;">
                <img th:src="@{/Assets/Admin/images/icons/empty.png}" style="display:block;margin:0 auto;" width="150px">
                <p style="width:100%;text-align:center;color:#666;margin-top:20px;" th:text="#{label.nothing_found}"/>
              </div>
            </div>

          </div>
        </div>
      </div>
      <!--Bottom Side Of Content Start-->

    </div>

  </div>
  <!-- content-wrapper ends -->


<ftr class="insert" th:insert="@{/Admin/Components/panel_footer}" />
